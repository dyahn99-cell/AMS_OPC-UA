<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMC 전체 제품 위젯 라이브러리</title>
<style>
:root{color-scheme:dark}[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#101720;color:#e7eef7;font:14px/1.5 'Segoe UI',system-ui}header{padding:26px 30px;border-bottom:1px solid #304253}h1{font-size:25px;letter-spacing:-.6px;margin:0}small,.muted,.iw-status,.iw-note{color:#a3b6c9;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}label{display:grid;gap:6px;font-size:12px}button,input,select{font:inherit;color:inherit;background:#1d2b3a;border:1px solid #40566b;border-radius:7px;padding:9px;max-width:100%;min-width:0}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px;padding:24px 30px}aside{min-width:0}aside label{margin-bottom:14px}#items{display:grid;gap:8px;max-height:630px;overflow:auto}.item{text-align:left;font-size:12px}.item[aria-pressed=true]{border-color:#71d6c9;background:#244347}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.iw-card{background:#1b2735;border:1px solid #334356;border-radius:16px;padding:22px;min-width:0}.iw-head{display:flex;gap:8px;align-items:center;justify-content:space-between}.iw-head h3{font-size:16px;margin:0}.iw-badge{font:10px ui-monospace,monospace;background:#283a4a;padding:4px 6px;border-radius:4px;white-space:nowrap}.iw-card>select{margin-top:16px;width:100%;font-size:12px}.iw-value{font-size:28px;margin:24px 0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.iw-value[data-quality=invalid]{color:#ffa993}.iw-value[data-quality=special],.iw-value[data-quality=unresolved]{color:#efd091}.iw-card label{margin:16px 0}.iw-actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.iw-actions button{font-size:11px}.iw-visual{color:#73d7cc}.iw-visual svg{width:100%;height:110px}.iw-visual progress{width:100%;accent-color:#73d7cc}.iw-visual small{display:block}details{margin-top:15px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}.iw-record{border-bottom:1px solid #334356;padding:10px 0}.section-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}.section-head h2{margin:0;font-size:18px}#page{display:flex;align-items:center;gap:12px;margin:14px 0}#catalog-state{overflow-wrap:anywhere}.info{background:#182330;border:1px solid #334356;padding:14px;border-radius:8px;margin:15px 0;font-size:12px} @media(max-width:750px){main{grid-template-columns:1fr;padding:16px}header{padding:20px}#items{max-height:260px}#gallery{grid-template-columns:1fr}}
</style>
<header><h1>SMC · 전체 제품 위젯 라이브러리</h1><p id="catalog-state"></p><span class="muted">IODD 기반 정의 · 모든 값은 원시값 시뮬레이션 · 실물 읽기/쓰기 없음</span><div class="toolbar" id="families"></div></header>
<details open style="margin:24px 30px"><summary>EXW1-RL 수동 구성 · 로컬 저장</summary><div id="server-workspace"></div><div id="live-results"></div><div id="master-editor"></div><details><summary>모의 PD 패킷 검증 · 실제 통신 없음</summary><div id="packet-lab"></div></details></details><main><aside><label>제품군<select id="category"></select></label><label>모델·제품 ID 검색<input id="search" placeholder="모델명, 제품 ID, Device ID"></label><label>장비<select id="product"></select></label><label>IODD 버전 (명시 선택)<select id="revision"></select></label><div id="product-info" class="info"></div><label>데이터 종류<select id="source"><option value="all">전체</option><option>PD IN</option><option>PD OUT</option><option>ACYCLIC</option></select></label><label>항목 검색<input id="query" placeholder="항목명, Index"></label><div id="items"></div><div id="page"><button id="prev">이전</button><span id="page-label"></span><button id="next">다음</button></div></aside><section><div class="section-head"><h2>디바이스 화면</h2><button id="auto-dashboard">자동 구성</button><button id="clear">개별 위젯 비우기</button><button id="examples">이 모델의 유형별 예제</button></div><p class="muted">항목을 누르면 추가/제거됩니다. 숫자 항목은 수치·게이지·추이·누적 표시를 전환할 수 있습니다.</p><div id="manual-review" class="info"></div><div class="info"><label>수동 PD 레이아웃 선택<select id="pd-layout"></select></label><p id="layout-info"></p></div><p id="sample-state"></p><button id="disconnect-samples">선택 포트 모의 연결 끊기</button><div id="device-dashboard"></div><details id="widget-editor"><summary>개별 위젯 편집·유형별 예제</summary><div id="gallery"></div></details><details><summary>선택 모델: 표준 변수 참조 · 미해석</summary><pre id="standard"></pre></details><details><summary>원본·조건·해석 제한</summary><pre id="definition"></pre></details></section></main>
<script id="data" type="application/json">__DATA__</script><script>__WIDGETS__</script><script>
(()=>{const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),models=new Map(data.models.map(m=>[m.sha256,m]));let product=null,model=null,page=0,selected=new Set();const size=24;const samples=new IoddWorkspace.Samples();let sampleContext=null,activeWidgets=[],liveView=false;
function opt(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o);}
$('catalog-state').textContent=`${data.products.length}개 장비 식별 항목 · ${data.models.length}개 IODD 정의 · ${data.models.reduce((n,m)=>n+m.items.length,0).toLocaleString()}개 항목`;
opt($('category'),'all','전체 제품군');[...new Set(data.products.flatMap(p=>p.categories))].sort().forEach(c=>opt($('category'),c,c));
const group=document.getElementById('families');for(const [label,category] of [['유량','Digital Flow Switch'],['압력','Pressure Switches'],['위치','Position Sensor'],['온습도','Electronic Temperature & Humidity Switches'],['진공','Vacuum Unit / Vacuum Manifold'],['밸브·I/O','Manifold Valve'],['구동','Step Motor Controller'],['이오나이저','Ionizers']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{$('category').value=category;$('search').value='';products();};group.append(b);}
function products(){const query=$('search').value.toLowerCase(),cat=$('category').value;const ps=data.products.filter(p=>(cat==='all'||p.categories.includes(cat))&&(p.names.join(' ')+' '+p.product_ids.join(' ')+' '+p.device_id).toLowerCase().includes(query));$('product').replaceChildren();ps.forEach(p=>opt($('product'),p.product_key,p.names.join(' / ')+' · '+p.device_id));chooseProduct();}
function chooseProduct(){product=data.products.find(p=>p.product_key===$('product').value);$('revision').replaceChildren();if(!product){model=null;sampleContext=null;setupDashboard();selected.clear();$('items').replaceChildren();$('gallery').replaceChildren();$('product-info').textContent='검색 결과 없음';$('manual-review').replaceChildren();$('device-dashboard').replaceChildren();$('pd-layout').replaceChildren();$('layout-info').textContent='';$('standard').textContent='';$('definition').textContent='';$('page-label').textContent='0 / 0';$('prev').disabled=$('next').disabled=true;return;}opt($('revision'),'','버전을 선택하세요');product.revisions.forEach(r=>opt($('revision'),r.definition_key,(r.release_date||'날짜 없음')+' · '+(r.version||'버전 없음')+' · '+r.definition_key.slice(0,8)));if(product.revisions.length===1)$('revision').value=product.revisions[0].definition_key;chooseRevision();}
function chooseRevision(){sampleContext=null;liveView=false;model=models.get($('revision').value)||null;selected.clear();page=0;$('product-info').textContent=product?product.categories.join(' / ')+' · '+product.product_ids.length+'개 제품 변형 · 실물 미검증':'';$('standard').textContent=model?JSON.stringify(model.standard_references,null,2):'';$('definition').textContent=model?JSON.stringify({sources:model.sources,warnings:model.warnings,layouts:model.layouts,limitations:data.limitations},null,2):'여러 정의가 있습니다. 실제 장비에 해당하는 버전을 선택하세요.';setupDashboard();examples();}
function examples(){renderReview();selected.clear();if(model){const seen=new Set();model.items.forEach((it,i)=>{const k=it.source+':'+it.widget;if(!seen.has(k)&&seen.size<8){seen.add(k);selected.add(i);}});}items();render();}
function renderReview(){const box=$('manual-review');box.replaceChildren();if(!model){box.textContent='제품과 버전을 선택하면 매뉴얼 검토 결과를 표시합니다.';return;}IoddAcyclicDiagnostics.mount(box,model.diagnostic_review);const title=document.createElement('strong');title.textContent='매뉴얼 검토 · 변환 규칙 '+model.engineering_rules.length+'개 · 실물 미검증';box.append(title);for(const r of model.manual_reviews||[]){const note=document.createElement('p');note.textContent=r.note;box.append(note);const link=document.createElement('a');link.href=r.url;link.target='_blank';link.rel='noopener';link.textContent=r.manual+' · PDF '+r.pages.join(', ')+'쪽';link.style.color='#73d7cc';box.append(link);const pending=document.createElement('p');pending.textContent='추가 확인: '+r.open.join(' / ');box.append(pending);}const conflicts=model.engineering_conflicts||[];if(conflicts.length){const warning=document.createElement('p');warning.textContent='계수 불일치로 변환 제외: '+conflicts.map(c=>c.unit).join(', ');warning.style.color='#efd091';box.append(warning);}}
function filtered(){if(!model)return [];const q=$('query').value.toLowerCase(),s=$('source').value;return model.items.map((it,i)=>({it,i})).filter(({it})=>(s==='all'||it.source===s)&&(it.name+' '+it.id+' '+(it.index||'')).toLowerCase().includes(q));}
function items(){const all=filtered(),pages=Math.ceil(all.length/size);page=Math.max(0,Math.min(page,pages-1));$('items').replaceChildren();all.slice(page*size,(page+1)*size).forEach(({it,i})=>{const b=document.createElement('button');b.className='item';b.setAttribute('aria-pressed',selected.has(i));b.textContent=(it.name||it.id)+' · '+it.source+' · '+it.widget+(it.layout!==undefined?' · Layout '+it.layout:'');b.onclick=()=>{if(selected.has(i))selected.delete(i);else selected.add(i);items();render();};$('items').append(b);});$('page-label').textContent=(pages?page+1:0)+' / '+pages+' · '+all.length+'항목';$('prev').disabled=page===0;$('next').disabled=page+1>=pages;}
function render(){$('gallery').replaceChildren();if(!model){$('gallery').textContent='모델과 IODD 버전을 선택하세요.';return;}for(const i of selected){const it=model.items[i];IoddWidgets.mount($('gallery'),{model:model.name,definition_key:model.sha256,item:it,engineeringRule:model.engineering_rules?.find(r=>r.item_id===it.id),sample:IoddWidgets.sample(it),view:IoddWidgets.views(it)[0]});}if(!selected.size)$('gallery').textContent='왼쪽에서 항목을 선택해 위젯을 추가하세요.';}

function setupDashboard(){
 const select=$('pd-layout');select.replaceChildren();opt(select,'','레이아웃을 선택하세요');
 if(model){for(const l of model.layouts){const conditions=l.condition.map(c=>JSON.stringify(c.attributes)).join(' / ');opt(select,String(l.id),'Layout '+l.id+' · '+(conditions||'조건 없음'));}if(model.layouts.length===1&&!model.layouts[0].condition.length)select.value=String(model.layouts[0].id);}
 renderDashboard();
}
function renderDashboard(){
 const host=$('device-dashboard');host.replaceChildren();activeWidgets=[];$('sample-state').textContent=sampleContext?(liveView?'읽기 전용 수신값 · 30초 후 오래된 값 처리':'포트별 모의 샘플 · 30초 후 오래된 값으로 처리 · 실제 수신 없음'):'제품 정의 보기 · 포트 데이터 미연결';if(!model){$('layout-info').textContent='제품과 IODD 버전을 선택하세요.';return;}
 const composition=IoddDeviceDashboard.compose(model,$('pd-layout').value);
 $('layout-info').textContent=composition.layout===null?'PD 구성을 읽었다고 가정하지 않습니다. 레이아웃을 선택해야 측정·상태·출력 위젯을 구성합니다.':'수동 선택 · 실제 장비 설정 미확인 · '+JSON.stringify(composition.condition)+' · 모든 초기 값은 미수신';
 for(const group of composition.groups){
  const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=group.title+' · '+group.bindings.length;section.append(heading);
  const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:24px';section.append(grid);host.append(section);
  if(!group.bindings.length){const p=document.createElement('p');p.className='muted';p.textContent='해당 항목 없음 또는 PD 레이아웃 선택 대기';grid.append(p);continue;}
  let shown=0;const more=document.createElement('button');
  const batch=()=>{for(const b of group.bindings.slice(shown,shown+6)){const item=model.items[b.index];const context=sampleContext;const widget=IoddWidgets.mount(grid,{readOnly:liveView,model:model.name,definition_key:model.sha256,item,view:b.view,sample:context?samples.get(context,item.id).value:null,onSample:value=>{if(context)samples.set(context,item.id,value);},engineeringRule:model.engineering_rules.find(r=>r.item_id===item.id)});activeWidgets.push({widget,item:item.id,context});}shown=Math.min(shown+6,group.bindings.length);more.textContent='더 보기 · '+shown+' / '+group.bindings.length;more.hidden=shown===group.bindings.length;};
  more.onclick=batch;section.append(more);batch();
 }
}
$('pd-layout').onchange=()=>{sampleContext=null;renderDashboard();};$('auto-dashboard').onclick=renderDashboard;
function openPort(p,masterId,config){const target=data.products.find(x=>x.revisions.some(r=>r.definition_key===p.definition));if(!target)return;$('category').value='all';$('search').value='';products();$('product').value=target.product_key;chooseProduct();$('revision').value=p.definition;chooseRevision();$('pd-layout').value=String(p.layout);liveView=masterId.startsWith('live:');sampleContext=JSON.stringify([masterId,config.base,config.channel,p.id,p.definition,p.layout,p.mode,p.input,p.output,p.swap]);renderDashboard();$('layout-info').textContent='포트 P'+p.id+' · '+(p.alias||'별칭 없음')+' · '+$('layout-info').textContent;$('device-dashboard').scrollIntoView({behavior:'smooth'});}
const editor=IoddMasterEditor.mount($('master-editor'),data.models,p=>openPort(p,'draft',editor.getConfig()));
IoddPacketLab.mount($('packet-lab'),editor,data.models,(p,config,result,timestamp)=>{openPort(p,'packet-lab',config);for(const f of result.fields)samples.set(sampleContext,f.item_id,f.quality==='good'?f.value:null,timestamp);renderDashboard();$('sample-state').textContent='모의 패킷 P'+p.id+' · '+result.quality+' · 진단 프로파일 '+result.diagnostic_profile+' · 실제 수신 아님';});
if(location.pathname==='/device-workspace')IoddWorkspace.mount($('server-workspace'),editor,data.models,openPort,data=>{if(!data){$('live-results').replaceChildren();if(liveView&&sampleContext){samples.disconnect(sampleContext);renderDashboard();$('sample-state').textContent='읽기 대기 · 이전 수신값 비움';}return;}const box=$('live-results');box.replaceChildren();for(const result of data.decoded.ports){const p=data.config.ports[result.port-1];if(!p.enabled||!['manual','autostart'].includes(p.mode))continue;const b=document.createElement('button');b.textContent='P'+p.id+' 수신 위젯 · '+result.quality;b.onclick=()=>{openPort(p,'live:'+data.id,data.config);for(const f of result.fields)samples.set(sampleContext,f.item_id,f.quality==='good'?f.value:null,data.response.timestamp);renderDashboard();$('sample-state').textContent='입력 1회 수신 · '+new Date(data.response.timestamp).toLocaleTimeString()+' · P'+p.id+' '+result.quality;};box.append(b);}});
$('disconnect-samples').onclick=()=>{if(sampleContext)samples.disconnect(sampleContext);renderDashboard();$('sample-state').textContent='모의 연결 끊김 · 선택 포트 값 무효화';};
setInterval(()=>{let stale=false;for(const w of activeWidgets)if(w.context&&samples.get(w.context,w.item).quality==='stale'){w.widget.setSample(null);stale=true;}if(stale)$('sample-state').textContent='30초 이상 갱신되지 않은 값 · 미수신 처리';},1000);
$('category').onchange=products;$('search').oninput=products;$('product').onchange=chooseProduct;$('revision').onchange=chooseRevision;$('source').onchange=$('query').oninput=()=>{page=0;items();};$('prev').onclick=()=>{page--;items();};$('next').onclick=()=>{page++;items();};$('clear').onclick=()=>{selected.clear();items();render();};$('examples').onclick=()=>{examples();$('widget-editor').open=true;};products();})();
</script></html>
