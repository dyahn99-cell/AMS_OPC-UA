<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMC IODD 위젯 연구실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#e2eaf2;font:14px/1.5 system-ui}header{padding:24px 32px;border-bottom:1px solid #334150}h1{font-size:24px;margin:0}h2{font-size:18px}small,.muted{color:#a9b8c8}main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;padding:24px 32px}aside,section{min-width:0}label{display:block;margin:12px 0}select,input,button{font:inherit;background:#202d3b;color:#e2eaf2;border:1px solid #4b6075;border-radius:6px;padding:9px;max-width:100%}select,input{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.widget{background:#1b2632;border:1px solid #334150;border-radius:12px;padding:20px}.value{font-size:32px;margin:18px 0;color:#79dfd0}.badge{display:inline-block;padding:3px 7px;background:#314052;border-radius:5px;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}hr{border:0;border-top:1px solid #334150;margin:20px 0}progress{width:100%;accent-color:#79dfd0}#items{max-height:480px;overflow:auto;display:grid;gap:8px}.item{text-align:left;width:100%}.item[aria-pressed=true]{border-color:#79dfd0;background:#234640}details{margin-top:16px}svg{width:100%;height:120px} @media(max-width:760px){main{grid-template-columns:1fr;padding:18px}header{padding:18px}#items{max-height:260px}}
</style>
<header><div class="row"><h1>SMC · IODD 위젯 연구실</h1><span class="badge">오프라인 · 실물 통신 없음</span></div><p id="summary"></p><small>IODD의 실제 항목 정의 + 명시적 모의 값 · 단위·배율·조건은 자동 적용하지 않음</small></header>
<main><aside><label>제품·버전 검색<input id="search" placeholder="ISE70, PF3W, ITV …"></label><label>IODD 모델<select id="model"></select></label><div id="identity"></div><label>데이터 종류<select id="source"><option value="all">전체</option><option>PD IN</option><option>PD OUT</option><option>ACYCLIC</option></select></label><label>항목 검색<input id="query" placeholder="Pressure, Peak, Unit …"></label><div id="items"></div></aside><section><div class="row"><h2>공용 위젯 미리보기</h2><button id="clear">선택 초기화</button></div><p class="muted">항목을 선택해 추가합니다. 같은 정의로 수치·게이지·추이를 표시합니다.</p><div id="widgets" class="grid"></div><hr><details><summary>모델 분석 상태 · 원본 위치</summary><pre id="metadata"></pre></details><details><summary>표준 파라미터 참조 — 별도 표준 정의 필요</summary><pre id="standard"></pre></details></section></main>
<script id="catalog" type="application/json">__CATALOG__</script>
<script>
const catalog=JSON.parse(document.getElementById('catalog').textContent),$=id=>document.getElementById(id);let model,selected=[];
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('summary').textContent=`${catalog.summary.xml_documents}개 XML · ${catalog.summary.unique_documents}개 고유 문서 · ${catalog.summary.device_ids}개 Device ID`;
function models(){const q=$('search').value.toLowerCase();const list=catalog.models.filter(m=>(m.name+' '+m.deviceId+' '+m.variants.map(v=>v.productId).join(' ')).toLowerCase().includes(q));$('model').innerHTML=list.map(m=>`<option value="${m.sha256}">${escape(m.name)} · ${escape(m.document.releaseDate)}${m.sources.every(s=>s.includes('historical/'))?' · 구버전':''}</option>`).join('');choose();}
function choose(){model=catalog.models.find(m=>m.sha256===$('model').value);selected=[];if(!model){$('identity').textContent='검색 결과 없음';$('items').replaceChildren();$('widgets').replaceChildren();$('metadata').textContent='';$('standard').textContent='';return;}$('identity').textContent=`Vendor ${model.vendorId} / Device ${model.deviceId} · ${model.items.length}개 항목`;$('metadata').textContent=JSON.stringify({document:model.document,sources:model.sources,warnings:model.warnings,limitations:catalog.limitations},null,2);$('standard').textContent=JSON.stringify(model.standard_references,null,2);selected=model.items.map((x,i)=>({x,i})).filter(({x})=>x.source==='PD IN').slice(0,2).map(x=>x.i);items();widgets();}
function items(){const q=$('query').value.toLowerCase(),source=$('source').value;$('items').innerHTML=model.items.map((item,i)=>({item,i})).filter(({item})=>(source==='all'||source===item.source)&&(item.name+' '+item.id).toLowerCase().includes(q)).map(({item,i})=>`<button class="item" data-add="${i}" aria-pressed="${selected.includes(i)}">${escape(item.name||item.id)}<br><small>${item.source} · ${item.widget} · ${item.index?'Index '+escape(item.index):'Layout '+item.layout}</small></button>`).join('');}
function sample(item){if(item.datatype.choices?.length)return item.datatype.choices[0].value;if(item.widget==='status')return 'true';if(item.widget==='number'){const lo=Number(item.datatype.ranges?.[0]?.lowerValue??0),hi=Number(item.datatype.ranges?.[0]?.upperValue??100);return String(Math.round((lo+hi)/2));}return '모의 값';}
function widgets(){$('widgets').innerHTML=selected.map(i=>{const item=model.items[i],numeric=item.widget==='number';return `<article class="widget"><div class="row"><span class="badge">${item.source}</span><span class="badge">${escape(item.accessRights||'접근 별도 확인')}</span></div><h2>${escape(item.name||item.id)}</h2><small>${escape(item.description)}</small><p class="muted">${item.condition?.length?'조건부 PD — 실제 조건 선택 필요':'실물 미조회'} · ${item.index?'Index '+escape(item.index):'Layout '+item.layout}</p>${numeric?'<label>표시 형태<select data-style="'+i+'"><option value="number">수치</option><option value="gauge">게이지</option><option value="trend">추이</option></select></label>':''}<div data-display="${i}" class="value">${escape(sample(item))}</div><label>모의 값 ${numeric?'(raw)':''}${item.datatype.choices?.length?'<select data-value="'+i+'">'+item.datatype.choices.map(c=>'<option value="'+escape(c.value)+'">'+escape(c.label)+' ('+escape(c.value)+')</option>').join('')+'</select>':'<input data-value="'+i+'" value="'+escape(sample(item))+'">'}</label><small>모의 값 · 단위/배율 미적용${numeric?' · 게이지 범위 0–100은 시안용':''}</small>${['structure','unresolved'].includes(item.widget)?'<p>복합/미해석 항목 · 원본 정의 확인 필요</p>':''}<details><summary>항목 정의</summary><pre>${escape(JSON.stringify(item,null,2))}</pre></details><button data-remove="${i}">위젯 제거</button></article>`;}).join('')||'<p class="muted">왼쪽에서 표시할 항목을 선택하세요.</p>';}
function update(i){const input=document.querySelector('[data-value="'+i+'"]'),display=document.querySelector('[data-display="'+i+'"]'),style=document.querySelector('[data-style="'+i+'"]')?.value||'number',n=Number(input.value);display.replaceChildren();if(style==='number'){display.textContent=input.tagName==='SELECT'?input.options[input.selectedIndex].text:input.value;return;}if(!Number.isFinite(n)){display.textContent='숫자를 입력하세요';return;}if(style==='gauge'){const p=document.createElement('progress');p.max=100;p.value=Math.max(0,Math.min(100,n));p.setAttribute('aria-label','모의 게이지');display.append(p,document.createTextNode(n+' raw'));}else{display.innerHTML='<svg viewBox="0 0 300 120" role="img" aria-label="동일한 모의 값의 5개 샘플. 실제 이력 아님"><line x1="20" y1="95" x2="280" y2="95" stroke="#607080"/><polyline points="20,60 85,60 150,60 215,60 280,60" fill="none" stroke="#79dfd0" stroke-width="2"/><text x="20" y="30" fill="#e2eaf2">'+escape(n)+' raw · 모의 5개 샘플</text></svg>';}}
$('search').addEventListener('input',models);$('model').addEventListener('change',choose);$('source').addEventListener('change',()=>model&&items());$('query').addEventListener('input',()=>model&&items());$('clear').onclick=()=>{selected=[];if(model){items();widgets();}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.add!==undefined){const i=Number(b.dataset.add);selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];items();widgets();}if(b.dataset.remove!==undefined){selected=selected.filter(i=>i!==Number(b.dataset.remove));items();widgets();}});document.addEventListener('input',e=>{if(e.target.dataset.value!==undefined)update(Number(e.target.dataset.value));});document.addEventListener('change',e=>{if(e.target.dataset.style!==undefined)update(Number(e.target.dataset.style));});models();
</script></html>
